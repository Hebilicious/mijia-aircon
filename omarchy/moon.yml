$schema: "https://moonrepo.dev/schemas/project.json"

layer: application
tags: ["omarchy"]

tasks:
  check:
    command: "jq empty manifest.json"
    inputs: ["manifest.json"]
    options:
      shell: true
  install:
    command: "bash install.sh"
    deps: ["aircon:install"]
    options:
      cache: false
      runInCI: false
      shell: true
