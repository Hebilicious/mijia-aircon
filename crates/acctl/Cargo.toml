[package]
name = "acctl"
version = "0.1.0"
rust-version = "1.88"
description = "Local LAN control for the Mijia Air Conditioner Pro Eco (xiaomi.airc.ra1r00): CLI and MCP server"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["xiaomi", "mijia", "miio", "air-conditioner", "mcp"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
rmcp = { version = "3.5", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
ureq = "3"
