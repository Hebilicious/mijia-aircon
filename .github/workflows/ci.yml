name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs every task unconditionally: `moon ci` diffs against a base revision and
  # would run nothing on the first push to main.
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history: on pull requests moon diffs against the base branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/toolchains

      - run: moon run aircon:check aircon:lint aircon:test aircon:build omarchy:check
